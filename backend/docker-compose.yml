
services:
  postgres:
    image: postgres:17
    container_name: education-center-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-education_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace_with_a_local_password}
      POSTGRES_DB: ${DB_DATABASE:-education_center}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
